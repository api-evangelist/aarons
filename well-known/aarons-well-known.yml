generated: '2026-08-29'
method: probed
source: live GET probes of /.well-known/ on every Aaron's host discovered in this round
summary: >-
  Three real machine-readable documents are served, all on login.aarons.com — Aaron's Okta
  custom-domain identity host. RFC 8414 authorization-server metadata, OpenID Connect discovery for
  the org authorization server, and OpenID Connect discovery for the "default" custom authorization
  server the myaccount.aarons.com application actually authenticates against. That is a genuine
  WellKnown hit and the pointer is earned. Nothing else is served anywhere on the estate: no
  security.txt on any host (so NO SecurityTxt pointer), no api-catalog, no ai-plugin.json, and no
  A2A agent card.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the three 200s on login.aarons.com. SecurityTxt
  pointer NOT emitted — RFC 9116 is unimplemented estate-wide; login.aarons.com answers 405 (Okta
  rejects the method) and every other host either 404s or returns an SPA shell.
false_positive_watch: >-
  myaccount.aarons.com, apply.aarons.com and jobs.aarons.com each answer HTTP 200 with a
  single-page-application / CMS shell for EVERY /.well-known/* path, including paths that cannot
  exist. Those 200s are recorded below as misses, not hits, with the shell noted. Any future round
  that treats one of those 200s as a served document is wrong.
hosts:
