  - aid: aarons:aarons-hpp
    name: Aaron's Hosted Payment Page (HPP)
    tags:
      - Payments
      - Tokenization
      - Card Vault
      - Webhook
      - Lease-to-Own
    tags_raw:
      - Payments
      - Tokenization
      - Card Vault
      - Webhooks
      - Lease-to-Own
    humanURL: https://www.aarons.com/ezpay.html
    baseURL: https://hpp.aarons.com
    properties:
      - url: openapi/aarons-hpp-openapi.json
        type: OpenAPI
      - url: overlays/aarons-hpp-overlay.yaml
        type: Overlay
      - url: asyncapi/aarons-hpp-webhooks.yml
        type: Webhooks
      - url: data-model/aarons-data-model.yml
        type: DataModel
      - url: https://hpp.aarons.com/openapi.json
        type: Website
    description: >-
      Aaron's Hosted Payment Page service — the only surface on the Aaron's estate that publishes a
      machine-readable API contract. A Swagger 2.0 document is served anonymously at
      https://hpp.aarons.com/openapi.json describing 15 paths: payment-session creation, customer
      context, device-intelligence capture for fraud screening, card tokenization and storage,
      zero-dollar authorization with AVS/CVV2 verification, EZPay retry, and three inbound postback
      receivers for the Fiserv and Repay payment gateways. The contract self-identifies as
      host hpp.aarons.com, and Aaron's own customer application at myaccount.aarons.com references
      the same host, so ownership is established from the document itself and not from the fetch URL.
      Bearer-token auth; Aaron's issues no third-party credentials and publishes no documentation.

